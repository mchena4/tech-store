[project]
name = "api-ecommerce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mchena", email = "m.chena@itecriocuarto.org.ar" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "mercadopago>=3.6.0",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "gunicorn>=23.0.0",
    "whitenoise>=6.8.0",
    "cloudinary>=1.41.0",
    "django-cloudinary-storage>=0.3.0",
]


[project.scripts]
api-ecommerce = "api_ecommerce:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
