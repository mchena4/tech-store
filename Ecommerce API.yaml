openapi: 3.0.3
info:
  title: Ecommerce API
  version: 1.0.0
  description: Endpoints for technology ecommerce
paths:
  /add_review/:
    post:
      operationId: add_review_create
      tags:
      - add_review
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /add_to_cart/:
    post:
      operationId: add_to_cart_create
      tags:
      - add_to_cart
      security:
